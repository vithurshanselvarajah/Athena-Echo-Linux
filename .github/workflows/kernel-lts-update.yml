name: Kernel LTS update

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: main
      - name: Check kernel.org for the latest LTS release
        id: kernel
        run: python3 ci/update_kernel_lts.py
      - name: Create kernel update branch and pull request
        id: pull-request
        if: steps.kernel.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          branch="kernel-$KERNEL_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          existing_pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "Kernel update PR #$existing_pr is already open"
            echo "operation=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" origin/main
            push_args=(--force-with-lease)
          else
            git switch -c "$branch"
            push_args=()
          fi
          git add build.sh
          git commit -m "chore: update kernel to $KERNEL_VERSION"
          git push "${push_args[@]}" origin "$branch"
          existing_pr=$(gh pr list --base main --head "$branch" --state all --json number,state --jq '.[0] | select(. != null) | "\(.number) \(.state)"')
          if [ -n "$existing_pr" ]; then
            read -r pr_number pr_state <<< "$existing_pr"
            if [ "$pr_state" = CLOSED ]; then
              gh pr reopen "$pr_number"
            elif [ "$pr_state" = MERGED ]; then
              gh pr create \
                --base main \
                --head "$branch" \
                --title "chore: update kernel to $KERNEL_VERSION" \
                --body "Updates the pinned Linux kernel to the latest active LTS release, $KERNEL_VERSION, and pins its SHA-256 from kernel.org. CI builds the kernel and Debian image for review."
            fi
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update kernel to $KERNEL_VERSION" \
              --body "Updates the pinned Linux kernel to the latest active LTS release, $KERNEL_VERSION, and pins its SHA-256 from kernel.org. CI builds the kernel and Debian image for review."
          fi
          echo "operation=created" >> "$GITHUB_OUTPUT"
      - name: Dispatch CI for the pull request branch
        if: steps.kernel.outputs.changed == 'true' && steps.pull-request.outputs.operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          branch="kernel-$KERNEL_VERSION"
          gh workflow run ci.yml --ref "$branch"
          gh workflow run images.yml --ref "$branch"
